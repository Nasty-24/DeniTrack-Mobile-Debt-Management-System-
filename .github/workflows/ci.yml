name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build a debug Android APK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests migrations scripts && ruff format --check app tests migrations scripts
      - name: Type check
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -q --cov=app --cov-report=term
      - name: Tests (PostgreSQL, including migrations and row-level security)
        env:
          DENITRACK_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dt_test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE dt_migrate"
          DENITRACK_PG_ADMIN_URL=postgresql+psycopg://postgres:postgres@localhost:5432/dt_migrate pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx jest --ci
      - name: Expo dependency check
        run: npx expo install --check
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: denitrack-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
